name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }    # oldest supported Python (macOS 11 ships 3.8)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (parsers, translations, statistics, security)
        run: python -m unittest discover -s tests -v
      - name: Python 3.8 syntax
        run: python -c "import ast; [ast.parse(open(f, encoding='utf-8').read(), feature_version=(3, 8)) for f in ('who_is_home.py', 'tools/demo.py', 'tools/icons.py')]"
      # Real run of the scan on each OS (CI runners are VMs: few or no devices answer, and that's fine).
      - name: Smoke test (check)
        env:
          WHOISHOME_DATA: ${{ runner.temp }}/who-is-home-data
        run: python who_is_home.py check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
