<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>who-is-home</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="who-is-home">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M8.5 20v-4.5a3.5 3.5 0 0 1 7 0V20"/><path d="M5.5 9.5V20h13V9.5"/></svg></span>
      <span>who-is-home</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <a href="#now" data-tab="now" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg><span data-i18n="tab.now"></span></a>
      <a href="#people" data-tab="people" role="tab"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg><span data-i18n="tab.people"></span></a>
      <a href="#devices" data-tab="devices" role="tab"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="13" height="9.5" rx="1.5"/><path d="M1 18h16"/><rect x="17.5" y="8" width="5" height="11.5" rx="1.3"/></svg><span data-i18n="tab.devices"></span></a>
      <a href="#report" data-tab="report" role="tab"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/></svg><span data-i18n="tab.report"></span></a>
      <a href="#settings" data-tab="settings" role="tab"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="tab.settings"></span></a>
    </nav>
    <div class="top-r">
      <a class="chip" id="netchip" hidden>
        <span class="dot" id="netdot"></span><span class="chip-txt"><b id="netname"></b></span>
      </a>
      <button class="icon-btn" id="refresh" data-i18n-title="refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="card notice" id="setup" hidden>
    <div><b id="setup-title"></b><span id="setup-body"></span></div>
  </div>

  <!-- ===================== AGORA ===================== -->
  <main class="view" id="v-now">
    <div class="hero is-idle" id="status">
      <div class="hero-row">
        <div class="hero-txt">
          <span class="pill"><i></i><span id="st-title">…</span></span>
          <div class="hero-lbl" id="st-lbl"></div>
          <div class="hero-num" id="st-num"></div>
          <div class="home-row" id="home-row"></div>
          <div class="hero-sub" id="st-sub"></div>
        </div>
        <div class="acts">
          <a class="act" href="#people"><span><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg></span><small data-i18n="tab.people"></small></a>
          <a class="act" href="#devices"><span><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="13" height="9.5" rx="1.5"/><path d="M1 18h16"/><rect x="17.5" y="8" width="5" height="11.5" rx="1.3"/></svg></span><small data-i18n="tab.devices"></small></a>
          <a class="act" href="#report"><span><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/></svg></span><small data-i18n="tab.report"></small></a>
          <a class="act" href="/wrapped"><span><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><small>Wrapped</small></a>
        </div>
      </div>
      <div class="day">
        <div class="day-h" id="day-sum"></div>
        <div class="day-track" id="day-track"></div>
        <div class="day-people" id="day-people"></div>
        <div class="day-ticks" id="day-ticks"></div>
      </div>
    </div>

    <div class="now-grid">
      <div class="card">
        <div class="card-h"><h3 data-i18n="ins.title"></h3></div>
        <div class="facts-list" id="facts"></div>
      </div>
      <div class="card tx-card">
        <div class="card-h"><h3 data-i18n="recent.title"></h3></div>
        <div class="tx" id="recent"></div>
      </div>
    </div>
    <a class="card todo-bar" id="todo-bar" href="#devices" hidden><span id="todo-bar-txt"></span><b data-i18n="todo.go"></b></a>
  </main>

  <!-- ===================== PESSOAS ===================== -->
  <main class="view" id="v-people" hidden>
    <div class="sec-h first">
      <div><h2 data-i18n="pp.title"></h2><p id="pp-desc">&nbsp;</p></div>
      <div id="people-period-slot">
        <div class="seg" id="period-seg">
          <button data-v="today" data-i18n="p.today"></button><button data-v="7d" data-i18n="p.7d"></button><button data-v="30d" data-i18n="p.30d"></button>
        </div>
      </div>
    </div>
    <div class="people" id="people"></div>
    <p class="unassigned" id="unassigned" hidden></p>
  </main>

  <!-- ===================== APARELHOS ===================== -->
  <main class="view" id="v-devices" hidden>
    <div class="sec-h first">
      <div><h2 data-i18n="dev.title"></h2><p id="dev-desc">&nbsp;</p></div>
      <div class="list-ctl">
        <div class="seg" id="dev-filter">
          <button data-v="all" data-i18n="dev.all"></button><button data-v="online" data-i18n="dev.online"></button><button data-v="offline" data-i18n="dev.offline"></button>
        </div>
        <select id="dev-sort"><option value="usage" data-i18n="sort.usage"></option><option value="name" data-i18n="sort.name"></option><option value="recent" data-i18n="sort.recent"></option></select>
      </div>
    </div>
    <div class="card" id="todo-card" hidden>
      <div class="card-h"><h3 data-i18n="todo.title"></h3></div>
      <div id="todo"></div>
    </div>
    <div id="devices"></div>
  </main>

  <!-- ===================== RELATÓRIO ===================== -->
  <main class="view" id="v-report" hidden>
    <div class="sec-h first">
      <div><h2 data-i18n="rep.title"></h2><p id="rep-desc">&nbsp;</p></div>
      <div id="report-period-slot"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card"><h3 data-i18n="rep.usage"></h3><div id="usage"></div></div>
      <div class="card"><h3 data-i18n="rep.cats"></h3><div id="cats"></div></div>
    </div>
    <div class="card full"><h3 data-i18n="rep.hours"></h3><div id="hours"></div></div>
    <div class="grid2">
      <div class="card"><h3 data-i18n="rep.apps"></h3><div id="apps"></div></div>
      <div class="card"><h3 data-i18n="rep.sites"></h3><div id="sites"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3 id="night-title"></h3><div id="night"></div></div>
      <div class="card"><h3 data-i18n="rep.blocked"></h3><div id="blocked"></div></div>
    </div>
  </main>

  <!-- ===================== AJUSTES ===================== -->
  <main class="view" id="v-settings" hidden>
    <div class="settings">
      <div class="card">
        <h2 data-i18n="ntfy.title"></h2>
        <p class="desc" id="ntfy-desc"></p>
        <div class="btns" style="align-items:center"><button class="btn" id="test" data-i18n="ntfy.test"></button><span class="res" id="test-res"></span></div>
      </div>
      <div class="card">
        <h2 data-i18n="set.look"></h2>
        <div class="form">
          <div class="field"><span data-i18n="lang"></span><div class="seg wrap-seg" id="lang-seg"></div></div>
          <div class="field"><span data-i18n="theme"></span><div class="seg wrap-seg" id="theme-seg"></div></div>
        </div>
        <p class="hint" id="theme-hint"></p>
      </div>
      <div class="card about">
        <h2 data-i18n="set.about"></h2>
        <dl class="facts" id="about"></dl>
      </div>
    </div>
  </main>

  <footer id="foot">who-is-home</footer>
</div>

<script src="/i18n.js"></script>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
